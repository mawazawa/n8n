apiVersion: v1
kind: Service
metadata:
  name: workflow-architect
  namespace: default
  labels:
    app: workflow-architect
  annotations:
    # Prometheus monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "3080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  selector:
    app: workflow-architect
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: workflow-architect-headless
  namespace: default
  labels:
    app: workflow-architect
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: workflow-architect
  ports:
    - name: http
      protocol: TCP
      port: 3080
      targetPort: http
